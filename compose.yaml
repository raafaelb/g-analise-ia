name: horus-ia
x-application: &application
  restart: unless-stopped
  build:
    context: .
    target: development
  image: horus-ia-php:local
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: horus_ia
    DB_USERNAME: horus
    DB_PASSWORD: ${DB_PASSWORD:-horus_local_development}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: database
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *application
    environment:
      PHP_CLI_SERVER_WORKERS: 4
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: horus_ia
      DB_USERNAME: horus
      DB_PASSWORD: ${DB_PASSWORD:-horus_local_development}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports: ["127.0.0.1:${APP_PORT:-8088}:8000"]
    command: ["php","artisan","serve","--host=0.0.0.0","--port=8000","--no-reload"]
  worker:
    <<: *application
    command: ["php","artisan","queue:work","--queue=actions,agents,default","--sleep=1","--tries=1","--timeout=960"]
    stop_grace_period: 30s
  documents:
    <<: *application
    command: ["php","artisan","queue:work","--queue=documents","--sleep=1","--tries=1","--timeout=90"]
    stop_grace_period: 100s
  scheduler:
    <<: *application
    command: ["php","artisan","schedule:work"]
  reverb:
    <<: *application
    ports: ["127.0.0.1:8087:8080"]
    command: ["php","artisan","reverb:start","--host=0.0.0.0","--port=8080"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horus_ia
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-horus_local_development}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U horus -d horus_ia"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      retries: 10
  frontend:
    image: node:24-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes: [".:/app"]
    ports: ["127.0.0.1:5173:5173"]
    command: ["npm","run","dev"]
    profiles: ["dev"]
volumes:
  postgres-data:
  redis-data:
