# Ensaio local descartável. PostgreSQL e Redis somente em memória; sem contas externas.
name: g-analise-ia-https-test
x-app: &app
  image: g-analise-ia-app:homologacao
  env_file: .env.homologacao
  environment:
    DB_HOST: postgres
    DB_DATABASE: ganalise_ensaio_descartavel
    DB_USERNAME: ensaio
    DB_PASSWORD: ""
    REDIS_HOST: redis
  volumes:
    - type: volume
      source: ephemeral-storage
      target: /var/www/html/storage
      volume: {nocopy: true}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ganalise_ensaio_descartavel
      POSTGRES_USER: ensaio
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ensaio -d ganalise_ensaio_descartavel"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
  app:
    <<: *app
    build: &build
      context: .
      target: production
      args:
        ASSET_URL: /ia-ganalise
        VITE_REVERB_APP_KEY: homologacao-local
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8443
        VITE_REVERB_SCHEME: https
        VITE_REVERB_PATH: /ia-ganalise/ws
  worker:
    <<: *app
    command: [php, artisan, 'queue:work', '--queue=agents', '--sleep=1', '--tries=1', '--timeout=960']
    stop_grace_period: 990s
  actions:
    <<: *app
    command: [php, artisan, 'queue:work', '--queue=actions,default', '--sleep=1', '--tries=1', '--timeout=960']
    stop_grace_period: 990s
  documents:
    <<: *app
    command: [php, artisan, 'queue:work', '--queue=documents', '--sleep=1', '--tries=1', '--timeout=90']
    stop_grace_period: 100s
  help:
    <<: *app
    command: [php, artisan, 'queue:work', '--queue=help', '--sleep=1', '--tries=1', '--timeout=180']
    stop_grace_period: 190s
  scheduler:
    <<: *app
    command: [php, artisan, 'schedule:work']
  reverb:
    <<: *app
    command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080]
  web:
    build:
      <<: *build
      target: web
    image: g-analise-ia-web:homologacao
    depends_on: [app,reverb]
  tls-test:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./backups/homologacao-local/tls-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backups/homologacao-local/localhost.crt:/certs/localhost.crt:ro
      - ./backups/homologacao-local/localhost.key:/certs/localhost.key:ro
    depends_on: [web]

volumes:
  ephemeral-storage:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=1000,gid=1000,mode=0750
