name: Testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i "s/^LOCAL_UID=.*/LOCAL_UID=$(id -u)/" .env
          sed -i "s/^LOCAL_GID=.*/LOCAL_GID=$(id -g)/" .env
      - run: python3 -m unittest discover -s tests/ops
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Compilar ferramentas homologadas
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: development
          load: true
          push: false
          tags: horus-ia-php:local
          cache-from: type=gha,scope=ganalise-tools-linux-amd64
          cache-to: type=gha,scope=ganalise-tools-linux-amd64,mode=max
      - run: docker compose run --rm --no-deps app composer install --no-interaction --prefer-dist
      - run: docker compose run --rm --no-deps app php artisan key:generate
      - run: docker compose run --rm frontend npm ci
      - run: docker compose run --rm frontend npm run test:frontend
      - run: docker compose run --rm frontend npm run build:local
      - run: docker compose run --rm --no-deps app php artisan test --compact
      - run: docker compose -f compose.yaml -f compose.tests.yaml up -d --wait postgres-test
      - run: docker compose -f compose.yaml -f compose.tests.yaml run --rm --no-deps app php scripts/test-postgres.php
      - run: docker compose run --rm --no-deps app vendor/bin/pint --test
      - run: docker compose run --rm --no-deps app php scripts/codex-smoke.php
      - name: Compilar e conferir configuracao da imagem de producao
        run: |
          python3 scripts/prepare-production.py --url https://ci.example.invalid/ia-ganalise
          docker compose --env-file .env.production -f compose.production.yaml build app web
          docker compose --env-file .env.production -f compose.production.yaml run --rm --no-deps app php artisan ganalise:preflight
      - name: Conferir pacote de codigo versionado
        run: python3 scripts/package-release.py --output "${RUNNER_TEMP}/g-analise-ia-source.tar.gz"
