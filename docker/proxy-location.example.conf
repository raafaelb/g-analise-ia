# Include dentro do server HTTPS existente. O proxy remove o prefixo antes do Laravel.
# O web interno registra método/caminho/status/duração sem parâmetros de login.
location = /ia-ganalise {
    access_log off;
    error_log /dev/stderr crit;
    return 308 /ia-ganalise/;
}
location /ia-ganalise/ {
    access_log off;
    error_log /dev/stderr crit;
    proxy_pass http://127.0.0.1:8089/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 200s;
    client_max_body_size 11m;
}
