server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 11m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /app/ { try_files $uri /index.php?$query_string; }
    location /ws/ { proxy_pass http://reverb:8080/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 75s; }
    location ~ ^/index\.php(/|$) { include fastcgi_params; fastcgi_pass app:9000; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param HTTP_PROXY ""; fastcgi_read_timeout 200s; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
