map $request_uri $ganalise_log_path {
    ~^(?<ganalise_path_without_query>[^?]*) $ganalise_path_without_query;
    default "/";
}
log_format ganalise_access escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$ganalise_log_path",'
    '"status":$status,"duration":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent}';
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream ganalise_php {
    zone ganalise_php 64k;
    server app:9000 resolve;
}
upstream ganalise_reverb {
    zone ganalise_reverb 64k;
    server reverb:8080 resolve;
}
server {
    access_log /dev/stdout ganalise_access;
    error_log /dev/stderr crit;
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 11m;
    location ^~ /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /app/ { try_files $uri /index.php?$query_string; }
    location /ws/ { proxy_pass http://ganalise_reverb/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 75s; }
    location ~ ^/index\.php(/|$) { include fastcgi_params; fastcgi_pass ganalise_php; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param HTTP_PROXY ""; fastcgi_read_timeout 200s; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
